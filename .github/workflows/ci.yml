name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests-api:
    name: Tests API (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        working-directory: backend
        run: pytest -v --tb=short

  tests-e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        working-directory: backend
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: backend
        run: pytest tests_e2e/ -v --tb=short

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/test-results/
          retention-days: 7

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: tests-api
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: reclampro:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — démarrer le conteneur et vérifier /api/health
        run: |
          docker run -d --name app-smoke \
            -e DATABASE_URL=sqlite:////tmp/test.db \
            -e JWT_SECRET=ci-test-secret-do-not-use-in-prod-12345 \
            -e APP_CRYPTO_KEY=ci-test-crypto-key-do-not-use-in-prod-67890 \
            -e SEED_AT_STARTUP=false \
            -p 8000:8000 \
            reclampro:ci-${{ github.sha }}

          # Attendre que /api/health réponde 200 (max 30 s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health > /dev/null; then
              echo "✅ Conteneur opérationnel"
              docker logs app-smoke | tail -20
              exit 0
            fi
            sleep 1
          done

          echo "❌ Conteneur n'a pas démarré"
          docker logs app-smoke
          exit 1

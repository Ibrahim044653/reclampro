[pytest]
# Par défaut, on ne lance que les tests unitaires/API (rapides).
# Les tests E2E (Playwright) sont dans tests_e2e/ et lancés explicitement :
#     pytest tests_e2e/          # E2E seuls
#     pytest tests/ tests_e2e/   # Tout
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
